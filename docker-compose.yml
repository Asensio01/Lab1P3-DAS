version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech_backend
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_DSN: ${REDIS_DSN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db_postgres:
        condition: service_healthy
      db_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintech_net
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fintech_simulator
    restart: always
    environment:
      - BACKEND_URL=http://fintech_backend:8000 
      - PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fintech_net
  db_postgres:
    image: postgres:18-alpine
    container_name: fintech_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fintech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintech_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintech_net

  db_redis:
    image: redis:7-alpine
    container_name: fintech_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fintech_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintech_frontend
    restart: always
    profiles:
      - frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
      VITE_SIMULATOR_URL: ${VITE_SIMULATOR_URL:-http://localhost:8001}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fintech_net

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  fintech_net: